# Sveltia CMS config – 网站管理后台配置
backend:
  name: github
  repo: OWNER/REPO   # <- 替换为您的 GitHub 仓库，例如 wenhaoye/website
  branch: main
media_folder: site/images/uploads
public_folder: images/uploads
locale: zh_Hans
site_url: https://SITE_URL
display_url: https://SITE_URL
logo_url: /images/wenhao.jpg
collections:
  - name: gallery
    label: "📷 作品相册 Gallery"
    files:
      - name: gallery
        label: "相册照片（拖动可排序）"
        file: site/content/gallery.json
        format: json
        fields:
          - name: items
            label: 照片
            label_singular: 照片
            widget: list
            summary: "{{fields.title_zh}} / {{fields.title_en}}"
            fields:
              - { name: image, label: 照片, widget: image }
              - name: category
                label: 分类
                widget: select
                default: realestate
                options:
                  - { label: "地产 Real Estate", value: realestate }
                  - { label: "建筑 Construction", value: construction }
                  - { label: "房屋管理 Management", value: management }
                  - { label: "其他 Other", value: other }
              - { name: title_zh, label: "中文标题", widget: string, required: false }
              - { name: title_en, label: "English title", widget: string, required: false }
  - name: site
    label: "📝 网站内容 Site Content"
    files:
      - name: settings
        label: "联系方式与图片 Contact & Images"
        file: site/content/site.json
        format: json
        fields:
          - name: settings
            label: 联系方式
            widget: object
            fields:
              - { name: phone, label: "电话 Phone", widget: string }
              - { name: email, label: "邮箱 Email", widget: string, required: false }
              - { name: wechat, label: "微信号 WeChat", widget: string, required: false }
              - { name: har_url, label: "HAR 主页链接", widget: string }
              - { name: loan_url, label: "贷款主页链接", widget: string }
              - { name: apply_url, label: "贷款申请链接", widget: string }
          - name: images
            label: 网站图片
            widget: object
            fields:
              - { name: profile, label: "个人头像 Profile photo", widget: image }
              - { name: hero_bg, label: "首页背景大图 Hero background", widget: image }
              - { name: svc_realestate, label: "业务图：地产", widget: image }
              - { name: svc_mortgage, label: "业务图：贷款", widget: image }
              - { name: svc_construction, label: "业务图：建筑", widget: image }
              - { name: svc_management, label: "业务图：房屋管理", widget: image }
          - name: texts
            label: 文字（中英文）
            widget: object
            fields:
              - name: nav
                label: "导航栏 Navigation"
                widget: object
                collapsed: true
